project:
  type: website
  output-dir: _site
  resources:
    - CNAME
    - images/
    - files/

website:
  title: "Mirrormere Labs"
  description: "Mirrormere Labs is an independent consultancy in Edinburgh, UK, offering impact evaluation, monitoring and evaluation (MEL), and satellite and geospatial analysis for development programmes, their funders, and nature-based solutions."
  site-url: "https://www.mirrormerelabs.org"
  favicon: images/favicon.svg
  open-graph: true
  page-navigation: false
  search: false
  navbar:
    logo: images/brand/logo-mark-small.svg
    logo-alt: "Mirrormere Labs logo"
    right:
      - text: Services
        href: services.qmd
      - text: Work
        href: work/index.qmd
      - text: About
        href: about.qmd
      - text: Publications
        href: publications.qmd
      - text: Contact
        href: contact.qmd
      - icon: github
        href: https://github.com/mirrormerelabs
        aria-label: GitHub
      - icon: linkedin
        href: https://www.linkedin.com/in/peter-hargreaves-b57932107/
        aria-label: LinkedIn
  page-footer:
    left: |
      Mirrormere Labs, Summit House, 4-5 Mitchell Street, Edinburgh EH6 7BD
    right:
      - text: "peter@mirrormerelabs.org"
        href: "mailto:peter@mirrormerelabs.org"
      - text: GitHub
        href: https://github.com/mirrormerelabs
      - text: LinkedIn
        href: https://www.linkedin.com/in/peter-hargreaves-b57932107/

format:
  html:
    include-in-header:
      text: |
        <link rel="apple-touch-icon" href="/images/brand/apple-touch-icon.png">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400&family=Public+Sans:wght@400..750&display=swap">
    theme:
      - cosmo
      - styles.scss
    toc: false
    smooth-scroll: false
    anchor-sections: false
    code-copy: false
    footnotes-hover: false
    citations-hover: false
    include-after-body:
      text: |
        <script>
          // Swap a map preview for the live map when selected
          document.addEventListener('click', function (e) {
            var b = e.target.closest('.map-facade');
            if (!b) return;
            var f = document.createElement('iframe');
            f.className = 'map-frame';
            f.src = b.dataset.src;
            f.title = b.dataset.title;
            b.replaceWith(f);
          });
        </script>
        <script type="speculationrules">
          {"prerender": [{"where": {"href_matches": "/*"}, "eagerness": "moderate"}]}
        </script>
    link-external-newwindow: false
